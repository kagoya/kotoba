<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ことばの地図 - リアルタイムワードクラウド</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3-cloud/1.2.5/d3.layout.cloud.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/build/kuromoji.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; margin: 0; padding: 0; background-color: #f5f6fa; color: #333; display: flex; flex-direction: column; height: 100vh; }
        header { background-color: #2c3e50; color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; font-size: 1.2rem; }
        .status-badge { background-color: #f1c40f; color: #333; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
        .ready { background-color: #2ecc71; color: white; }
        .error { background-color: #e74c3c; color: white; }
        .fallback { background-color: #8e44ad; color: white; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        
        /* 左側（操作パネル＋ワードクラウド） */
        .left-pane { flex: 1; display: flex; flex-direction: column; padding: 10px; overflow-y: auto; }
        .controls { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        .control-group { display: flex; align-items: center; gap: 5px; margin-right: 15px; }
        button { cursor: pointer; padding: 8px 15px; border: none; border-radius: 4px; background-color: #3498db; color: white; font-weight: bold; transition: background-color 0.2s; }
        button:hover { background-color: #2980b9; }
        button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
        button.danger { background-color: #e74c3c; }
        button.danger:hover { background-color: #c0392b; }
        
        #cloud-container { flex: 1; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; min-height: 400px; }
        #cloud-svg { width: 100%; height: 100%; }

        /* 右側（サイドバー） */
        .right-sidebar { width: 300px; background: white; border-left: 1px solid #ddd; display: flex; flex-direction: column; overflow: hidden; }
        .sidebar-header { background: #ecf0f1; padding: 10px; font-weight: bold; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; }
        .sidebar-content { flex: 1; overflow-y: auto; padding: 10px; }
        
        .word-list { list-style: none; padding: 0; margin: 0; }
        .word-item { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px dashed #eee; font-size: 0.9rem; }
        .word-item:last-child { border-bottom: none; }
        .word-text { font-weight: bold; flex: 1; }
        .word-score { color: #7f8c8d; margin-right: 10px; font-size: 0.8rem; width: 40px; text-align: right; }
        .btn-exclude, .btn-restore { padding: 2px 6px; font-size: 0.7rem; border-radius: 3px; }
        .btn-exclude { background-color: #e74c3c; }
        .btn-restore { background-color: #2ecc71; }
        
        input[type="text"], textarea { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        textarea { width: 100%; box-sizing: border-box; resize: vertical; }
    </style>
</head>
<body>

    <header>
        <h1>ことばの地図 (Kotoba Map)</h1>
        <div id="status-indicator" class="status-badge">辞書データを読込み中...</div>
    </header>

    <div class="main-container">
        <div class="left-pane">
            <div class="controls">
                <div class="control-group">
                    <button id="btn-mic" disabled>🎤 マイク開始</button>
                    <span id="mic-status" style="font-size: 0.8rem; color: #e74c3c;">停止中</span>
                </div>
                <div class="control-group">
                    <label for="time-window">集計範囲:</label>
                    <select id="time-window">
                        <option value="60000">直近1分</option>
                        <option value="180000">直近3分</option>
                        <option value="600000">直近10分</option>
                        <option value="0" selected>すべて</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="calc-mode">モード:</label>
                    <select id="calc-mode">
                        <option value="tf">出現頻度 (TF)</option>
                        <option value="tfidf" selected>重要語 (TF-IDF)</option>
                    </select>
                </div>
                <div class="control-group">
                    <button id="btn-export-png">PNG保存</button>
                    <button id="btn-export-csv">CSV保存</button>
                    <button id="btn-clear" class="danger">データクリア</button>
                </div>
            </div>
            
            <div class="controls" style="margin-bottom: 10px;">
                <textarea id="text-input" rows="2" placeholder="テキストを直接貼り付けて集計することもできます"></textarea>
                <button id="btn-add-text" disabled>テキストを追加</button>
            </div>

            <div id="cloud-container">
                <svg id="cloud-svg"></svg>
            </div>
        </div>

        <div class="right-sidebar">
            <div class="sidebar-header">
                <span>📊 頻出語ランキング</span>
            </div>
            <div class="sidebar-content" style="flex: 2; border-bottom: 1px solid #ddd;">
                <ul id="ranking-list" class="word-list"></ul>
            </div>
            
            <div class="sidebar-header">
                <span>🚫 除外した単語</span>
            </div>
            <div class="sidebar-content" style="flex: 1; background: #fdfdfd;">
                <ul id="excluded-list" class="word-list"></ul>
                <p id="excluded-empty" style="font-size: 0.8rem; color: #aaa; text-align: center;">除外された単語はありません</p>
            </div>
        </div>
    </div>

    <script>
        const State = {
            tokenizer: null,
            useFallback: false,
            segmenter: null,
            documents: [], 
            excludedWords: new Set(),
            isRecording: false,
            recognition: null,
            currentWordData: [],
            lastInterimText: ""
        };

        const UI = {
            status: document.getElementById('status-indicator'),
            btnMic: document.getElementById('btn-mic'),
            micStatus: document.getElementById('mic-status'),
            timeWindow: document.getElementById('time-window'),
            calcMode: document.getElementById('calc-mode'),
            rankingList: document.getElementById('ranking-list'),
            excludedList: document.getElementById('excluded-list'),
            excludedEmpty: document.getElementById('excluded-empty'),
            btnAddText: document.getElementById('btn-add-text'),
            textInput: document.getElementById('text-input')
        };

        // --- 1. 解析エンジンの初期化 (kuromoji & フォールバック) ---
        // Intl.Segmenter の準備 (Chrome, Safari, Edgeで標準搭載)
        if (window.Intl && Intl.Segmenter) {
            State.segmenter = new Intl.Segmenter('ja-JP', { granularity: 'word' });
        }

        // 辞書URLを最も安定した jsdelivr に変更（末尾スラッシュなし）
        kuromoji.builder({ dicPath: "https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/dict" }).build((err, tokenizer) => {
            if (err) {
                console.warn("kuromoji辞書エラー、代替解析(Intl.Segmenter)に切り替えます:", err);
                if (State.segmenter) {
                    State.useFallback = true;
                    UI.status.innerText = "準備完了 (簡易解析モード)";
                    UI.status.className = "status-badge fallback";
                    startApp();
                } else {
                    UI.status.innerText = "エラー: 解析エンジン非対応";
                    UI.status.className = "status-badge error";
                    alert("お使いのブラウザは日本語解析に対応していません。");
                }
                return;
            }
            State.tokenizer = tokenizer;
            UI.status.innerText = "準備完了 (高精度モード)";
            UI.status.className = "status-badge ready";
            startApp();
        });

        function startApp() {
            UI.btnMic.disabled = false;
            UI.btnAddText.disabled = false;
            setInterval(processAndDraw, 5000);
        }

        // --- 2. 音声認識のセットアップ ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            State.recognition = new SpeechRecognition();
            State.recognition.lang = 'ja-JP';
            State.recognition.continuous = true;
            State.recognition.interimResults = true;

            State.recognition.onstart = () => {
                State.isRecording = true;
                UI.btnMic.innerText = "⏹ マイク停止";
                UI.btnMic.classList.add("danger");
                UI.micStatus.innerText = "録音中...";
                UI.micStatus.style.color = "#2ecc71";
            };

            State.recognition.onresult = (event) => {
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const res = event.results[i];
                    if (res.isFinal) {
                        addDocument(res[0].transcript);
                    }
                }
            };

            State.recognition.onend = () => {
                if (State.isRecording) {
                    try { State.recognition.start(); } catch(e){}
                }
            };
        } else {
            UI.btnMic.innerText = "マイク非対応";
        }

        UI.btnMic.addEventListener('click', () => {
            if (!State.recognition) return;
            if (State.isRecording) {
                State.isRecording = false;
                State.recognition.stop();
                UI.btnMic.innerText = "🎤 マイク開始";
                UI.btnMic.classList.remove("danger");
                UI.micStatus.innerText = "停止中";
                UI.micStatus.style.color = "#e74c3c";
            } else {
                State.recognition.start();
            }
        });

        // --- 3. データ追加 ---
        function addDocument(text) {
            if (!text.trim()) return;
            State.documents.push({ text: text, timestamp: Date.now() });
            processAndDraw();
        }

        UI.btnAddText.addEventListener('click', () => {
            if(UI.textInput.value) {
                UI.textInput.value.split(/\n/).forEach(line => addDocument(line));
                UI.textInput.value = "";
            }
        });

        document.getElementById('btn-clear').addEventListener('click', () => {
            if(confirm("データをクリアしますか？")) {
                State.documents = [];
                processAndDraw();
            }
        });

        // --- 4. テキスト解析・集計処理 ---
        function processAndDraw() {
            if (!State.tokenizer && !State.useFallback) return;

            const windowMs = parseInt(UI.timeWindow.value, 10);
            const now = Date.now();
            const mode = UI.calcMode.value;

            let targetDocs = State.documents;
            if (windowMs > 0) {
                targetDocs = State.documents.filter(doc => (now - doc.timestamp) <= windowMs);
            }

            if (targetDocs.length === 0) {
                State.currentWordData = [];
                updateUI();
                return;
            }

            const termFreq = {};
            const docFreq = {};
            const docCount = targetDocs.length;
            
            // フィラーや不要な文字の除外用
            const fillerRegex = /^(えーっと|えーと|えー|ええ|あのー|あの|うーん|うん|まぁ|まあ|なんか|なんだろう)$/;
            const numberRegex = /^[0-9０-９]+$/; 

            targetDocs.forEach(doc => {
                let cleanText = doc.text.replace(/[!！?？。、.,]/g, " ");
                const wordsInThisDoc = new Set();

                // ★ 高精度モード (kuromoji.js)
                if (State.tokenizer) {
                    const tokens = State.tokenizer.tokenize(cleanText);
                    tokens.forEach(token => {
                        if (["名詞", "動詞", "形容詞"].includes(token.pos)) {
                            if (token.pos_detail_1 === "非自立" || token.pos_detail_1 === "代名詞" || token.pos_detail_1 === "数") return;
                            let word = token.basic_form !== "*" ? token.basic_form : token.surface_form;
                            if (word.length <= 1 && token.pos === "名詞" && /^[ぁ-んァ-ン]$/.test(word)) return;
                            if (fillerRegex.test(word) || numberRegex.test(word) || State.excludedWords.has(word)) return;

                            termFreq[word] = (termFreq[word] || 0) + 1;
                            wordsInThisDoc.add(word);
                        }
                    });
                } 
                // ★ 代替解析モード (Intl.Segmenter)
                else if (State.useFallback && State.segmenter) {
                    const segments = State.segmenter.segment(cleanText);
                    for (const seg of segments) {
                        if (seg.isWordLike) {
                            let word = seg.segment;
                            // 1文字のひらがな（助詞など）は除外
                            if (word.length <= 1 && /^[ぁ-んァ-ン]$/.test(word)) continue;
                            if (fillerRegex.test(word) || numberRegex.test(word) || State.excludedWords.has(word)) continue;
                            
                            termFreq[word] = (termFreq[word] || 0) + 1;
                            wordsInThisDoc.add(word);
                        }
                    }
                }

                wordsInThisDoc.forEach(word => {
                    docFreq[word] = (docFreq[word] || 0) + 1;
                });
            });

            const wordScores = [];
            for (const word in termFreq) {
                let score = 0;
                if (mode === "tfidf") {
                    const tf = termFreq[word];
                    const idf = Math.log10(docCount / docFreq[word]) + 1;
                    score = tf * idf;
                } else {
                    score = termFreq[word];
                }
                wordScores.push({ text: word, size: score, count: termFreq[word] });
            }

            wordScores.sort((a, b) => b.size - a.size);
            State.currentWordData = wordScores.slice(0, 100);
            updateUI();
        }

        // --- 5. 描画とUI更新 ---
        function updateUI() {
            drawCloud(State.currentWordData);
            updateSidebar();
        }

        function drawCloud(words) {
            const container = document.getElementById('cloud-container');
            const width = container.clientWidth;
            const height = container.clientHeight;
            
            d3.select("#cloud-svg").selectAll("*").remove();
            if (words.length === 0) return;

            const maxSize = words[0].size;
            const minSize = words[words.length - 1].size;
            
            const sizeScale = d3.scaleLinear().domain([minSize, maxSize]).range([15, 80]);

            d3.layout.cloud()
                .size([width, height])
                .words(words.map(d => ({ text: d.text, size: sizeScale(d.size) })))
                .padding(3)
                .rotate(() => (~~(Math.random() * 2) * 90))
                .font("Impact")
                .fontSize(d => d.size)
                .on("end", draw)
                .start();

            function draw(drawnWords) {
                const color = d3.scaleOrdinal(d3.schemeCategory10);
                d3.select("#cloud-svg")
                    .attr("width", width)
                    .attr("height", height)
                    .append("g")
                    .attr("transform", `translate(${width / 2},${height / 2})`)
                    .selectAll("text")
                    .data(drawnWords)
                    .enter().append("text")
                    .style("font-size", d => `${d.size}px`)
                    .style("font-family", "Impact")
                    .style("fill", (d, i) => color(i))
                    .attr("text-anchor", "middle")
                    .attr("transform", d => `translate(${d.x},${d.y}) rotate(${d.rotate})`)
                    .text(d => d.text);
            }
        }

        function updateSidebar() {
            UI.rankingList.innerHTML = "";
            State.currentWordData.slice(0, 50).forEach((item, index) => {
                const li = document.createElement('li');
                li.className = 'word-item';
                
                const spanName = document.createElement('span');
                spanName.className = 'word-text';
                spanName.innerText = `${index + 1}. ${item.text}`;
                
                const spanScore = document.createElement('span');
                spanScore.className = 'word-score';
                spanScore.innerText = UI.calcMode.value === 'tf' ? item.count : item.size.toFixed(1);

                const btnExclude = document.createElement('button');
                btnExclude.className = 'btn-exclude';
                btnExclude.innerText = '除外';
                btnExclude.onclick = () => { State.excludedWords.add(item.text); processAndDraw(); };

                li.appendChild(spanName);
                li.appendChild(spanScore);
                li.appendChild(btnExclude);
                UI.rankingList.appendChild(li);
            });

            UI.excludedList.innerHTML = "";
            if (State.excludedWords.size === 0) {
                UI.excludedEmpty.style.display = "block";
            } else {
                UI.excludedEmpty.style.display = "none";
                Array.from(State.excludedWords).forEach(word => {
                    const li = document.createElement('li');
                    li.className = 'word-item';
                    
                    const spanName = document.createElement('span');
                    spanName.className = 'word-text';
                    spanName.innerText = word;
                    
                    const btnRestore = document.createElement('button');
                    btnRestore.className = 'btn-restore';
                    btnRestore.innerText = '復元';
                    btnRestore.onclick = () => { State.excludedWords.delete(word); processAndDraw(); };

                    li.appendChild(spanName);
                    li.appendChild(btnRestore);
                    UI.excludedList.appendChild(li);
                });
            }
        }

        // --- 6. エクスポート ---
        document.getElementById('btn-export-csv').addEventListener('click', () => {
            if(State.currentWordData.length === 0) return alert("データがありません");
            let csv = "単語,出現回数,スコア\n";
            State.currentWordData.forEach(d => { csv += `${d.text},${d.count},${d.size.toFixed(3)}\n`; });
            const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csv], {type: 'text/csv'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `kotoba_${Date.now()}.csv`;
            a.click();
        });

        document.getElementById('btn-export-png').addEventListener('click', () => {
            const svgElement = document.getElementById('cloud-svg');
            const serializer = new XMLSerializer();
            const svgString = serializer.serializeToString(svgElement);
            const canvas = document.createElement('canvas');
            canvas.width = svgElement.clientWidth || 800;
            canvas.height = svgElement.clientHeight || 600;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const img = new Image();
            img.onload = () => {
                ctx.drawImage(img, 0, 0);
                const a = document.createElement('a');
                a.download = `kotoba_cloud_${Date.now()}.png`;
                a.href = canvas.toDataURL('image/png');
                a.click();
            };
            img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgString)));
        });

        window.addEventListener('resize', () => { if(State.currentWordData.length > 0) drawCloud(State.currentWordData); });
        UI.timeWindow.addEventListener('change', processAndDraw);
        UI.calcMode.addEventListener('change', processAndDraw);
    </script>
</body>
</html>
