<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ことばの地図 - リアルタイムワードクラウド</title>
    <!-- 必要なライブラリの読み込み -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3-cloud/1.2.5/d3.layout.cloud.min.js"></script>
    <script src="https://unpkg.com/kuromoji@0.1.2/build/kuromoji.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; margin: 0; padding: 0; background-color: #f5f6fa; color: #333; display: flex; flex-direction: column; height: 100vh; }
        header { background-color: #2c3e50; color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; font-size: 1.2rem; }
        .status-badge { background-color: #f1c40f; color: #333; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
        .ready { background-color: #2ecc71; color: white; }
        .error { background-color: #e74c3c; color: white; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        
        /* 左側（操作パネル＋ワードクラウド） */
        .left-pane { flex: 1; display: flex; flex-direction: column; padding: 10px; overflow-y: auto; }
        .controls { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        .control-group { display: flex; align-items: center; gap: 5px; margin-right: 15px; }
        button { cursor: pointer; padding: 8px 15px; border: none; border-radius: 4px; background-color: #3498db; color: white; font-weight: bold; transition: background-color 0.2s; }
        button:hover { background-color: #2980b9; }
        button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
        button.danger { background-color: #e74c3c; }
        button.danger:hover { background-color: #c0392b; }
        
        #cloud-container { flex: 1; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; min-height: 400px; }
        #cloud-svg { width: 100%; height: 100%; }

        /* 右側（サイドバー） */
        .right-sidebar { width: 300px; background: white; border-left: 1px solid #ddd; display: flex; flex-direction: column; overflow: hidden; }
        .sidebar-header { background: #ecf0f1; padding: 10px; font-weight: bold; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; }
        .sidebar-content { flex: 1; overflow-y: auto; padding: 10px; }
        
        /* リストスタイル */
        .word-list { list-style: none; padding: 0; margin: 0; }
        .word-item { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px dashed #eee; font-size: 0.9rem; }
        .word-item:last-child { border-bottom: none; }
        .word-text { font-weight: bold; flex: 1; }
        .word-score { color: #7f8c8d; margin-right: 10px; font-size: 0.8rem; width: 40px; text-align: right; }
        .btn-exclude, .btn-restore { padding: 2px 6px; font-size: 0.7rem; border-radius: 3px; }
        .btn-exclude { background-color: #e74c3c; }
        .btn-restore { background-color: #2ecc71; }
        
        /* その他入力 */
        input[type="text"], textarea { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        textarea { width: 100%; box-sizing: border-box; resize: vertical; }
    </style>
</head>
<body>

    <header>
        <h1>ことばの地図 (Kotoba Map)</h1>
        <div id="status-indicator" class="status-badge">辞書データを読込み中...</div>
    </header>

    <div class="main-container">
        <!-- 左側：設定・クラウド表示 -->
        <div class="left-pane">
            <div class="controls">
                <div class="control-group">
                    <button id="btn-mic" disabled>🎤 マイク開始</button>
                    <span id="mic-status" style="font-size: 0.8rem; color: #e74c3c;">停止中</span>
                </div>
                <div class="control-group">
                    <label for="time-window">集計範囲:</label>
                    <select id="time-window">
                        <option value="60000">直近1分</option>
                        <option value="180000">直近3分</option>
                        <option value="600000">直近10分</option>
                        <option value="0" selected>すべて</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="calc-mode">モード:</label>
                    <select id="calc-mode">
                        <option value="tf">出現頻度 (TF)</option>
                        <option value="tfidf" selected>重要語 (TF-IDF)</option>
                    </select>
                </div>
                <div class="control-group">
                    <button id="btn-export-png">PNG保存</button>
                    <button id="btn-export-csv">CSV保存</button>
                    <button id="btn-clear" class="danger">データクリア</button>
                </div>
            </div>
            
            <div class="controls" style="margin-bottom: 10px;">
                <textarea id="text-input" rows="2" placeholder="テキストを直接貼り付けて集計することもできます"></textarea>
                <button id="btn-add-text" disabled>テキストを追加</button>
            </div>

            <div id="cloud-container">
                <svg id="cloud-svg"></svg>
            </div>
        </div>

        <!-- 右側：ランキングと除外リスト -->
        <div class="right-sidebar">
            <div class="sidebar-header">
                <span>📊 頻出語ランキング</span>
            </div>
            <div class="sidebar-content" style="flex: 2; border-bottom: 1px solid #ddd;">
                <ul id="ranking-list" class="word-list"></ul>
            </div>
            
            <div class="sidebar-header">
                <span>🚫 除外した単語</span>
            </div>
            <div class="sidebar-content" style="flex: 1; background: #fdfdfd;">
                <ul id="excluded-list" class="word-list"></ul>
                <p id="excluded-empty" style="font-size: 0.8rem; color: #aaa; text-align: center;">除外された単語はありません</p>
            </div>
        </div>
    </div>

    <script>
        // --- 状態管理 ---
        const State = {
            tokenizer: null,
            documents: [], // { text: "発話内容", timestamp: 1690000000, isFinal: true }
            excludedWords: new Set(),
            isRecording: false,
            recognition: null,
            currentWordData: [], // 描画用のデータ
            lastInterimText: ""
        };

        // UI要素
        const UI = {
            status: document.getElementById('status-indicator'),
            btnMic: document.getElementById('btn-mic'),
            micStatus: document
